<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" role="img" aria-label="Relation path between two typed nodes">
  <!-- relation-path: a typed edge sample with direction marker -->
  <path d="M40 60 C 110 20, 210 100, 280 60" fill="none" stroke="#9a7a24" stroke-width="1.5" stroke-dasharray="4 8" class="si-anim-edge"/>
  <circle cx="40" cy="60" r="7" fill="#ece5d6"/>
  <circle cx="40" cy="60" r="12" fill="none" stroke="#3a3324"/>
  <rect x="272" y="52" width="16" height="16" fill="none" stroke="#e0b04a" stroke-width="1.5" transform="rotate(45 280 60)"/>
  <text x="40" y="92" font-family="ui-monospace, monospace" font-size="11" fill="#b5ab96" text-anchor="middle">source</text>
  <text x="280" y="92" font-family="ui-monospace, monospace" font-size="11" fill="#b5ab96" text-anchor="middle">target</text>
  <text x="160" y="34" font-family="ui-monospace, monospace" font-size="11" fill="#e0b04a" text-anchor="middle">relation</text>
