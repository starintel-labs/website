<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" role="img" aria-label="Symbolic network: a lambda term bound to typed document, actor, and evidence nodes">
  <!--
    starintel lambda-network: the hero composition.
    A lambda term at the center of a typed document graph.
    Palette: obsidian-gold. Transparent canvas; sits on the design canvas token.
    Edge stroke-dasharray hooks the si-anim-edge class; node groups hook
    si-anim-node when inlined; animation is decorative only and disabled under
    prefers-reduced-motion by the design system.
  -->
  <defs>
    <radialGradient id="ln-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0b04a" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#e0b04a" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#e0b04a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo behind the lambda term -->
  <circle cx="280" cy="225" r="190" fill="url(#ln-halo)"/>

  <!-- structural grid ticks -->
  <g stroke="#241e13" stroke-width="1">
    <line x1="40" y1="225" x2="90" y2="225"/>
    <line x1="470" y1="225" x2="520" y2="225"/>
    <line x1="280" y1="25" x2="280" y2="60"/>
    <line x1="280" y1="390" x2="280" y2="425"/>
  </g>

  <!-- edges: documents, actors, evidence bound to the term -->
  <g stroke="#3a3324" stroke-width="1.5" fill="none">
    <path d="M280 225 C 210 190, 160 160, 108 128"/>
    <path d="M280 225 C 350 190, 400 160, 452 128"/>
    <path d="M280 225 C 205 265, 150 290, 96 312"/>
    <path d="M280 225 C 355 265, 410 290, 464 312"/>
    <path d="M280 225 C 250 300, 230 340, 208 384"/>
    <path d="M280 225 C 310 300, 330 340, 352 384"/>
  </g>
  <!-- active relation: dashed gold, animatable -->
  <path d="M280 225 C 280 160, 280 120, 280 78" stroke="#9a7a24" stroke-width="1.5" fill="none" stroke-dasharray="4 8" class="si-anim-edge"/>

  <!-- outer nodes: typed document kinds -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12">
    <!-- documents -->
    <g>
      <circle cx="108" cy="128" r="6" fill="#ece5d6"/>
      <circle cx="108" cy="128" r="10" fill="none" stroke="#3a3324" stroke-width="1"/>
      <text x="108" y="106" fill="#b5ab96" text-anchor="middle">documents</text>
    </g>
    <!-- actors -->
    <g>
      <circle cx="452" cy="128" r="6" fill="#ece5d6"/>
      <circle cx="452" cy="128" r="10" fill="none" stroke="#3a3324" stroke-width="1"/>
      <text x="452" y="106" fill="#b5ab96" text-anchor="middle">actors</text>
    </g>
    <!-- evidence -->
    <g>
      <rect x="90" y="306" width="12" height="12" fill="#ece5d6" transform="rotate(45 96 312)"/>
      <text x="96" y="340" fill="#b5ab96" text-anchor="middle">evidence</text>
    </g>
    <!-- claims -->
    <g>
      <rect x="458" y="306" width="12" height="12" fill="#ece5d6" transform="rotate(45 464 312)"/>
      <text x="464" y="340" fill="#b5ab96" text-anchor="middle">claims</text>
    </g>
    <!-- relations -->
    <g>
      <circle cx="208" cy="384" r="6" fill="#ece5d6"/>
      <text x="208" y="408" fill="#b5ab96" text-anchor="middle">relations</text>
    </g>
    <!-- sources -->
    <g>
      <circle cx="352" cy="384" r="6" fill="#ece5d6"/>
      <text x="352" y="408" fill="#b5ab96" text-anchor="middle">sources</text>
    </g>
  </g>

  <!-- apex node: publication gate -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12">
    <circle cx="280" cy="78" r="7" fill="#e0b04a"/>
    <circle cx="280" cy="78" r="12" fill="none" stroke="#9a7a24" stroke-width="1"/>
    <text x="280" y="52" fill="#e0b04a" text-anchor="middle">publish</text>
  </g>

  <!-- center: the lambda term -->
  <g>
    <circle cx="280" cy="225" r="52" fill="#090807" stroke="#4a3f28" stroke-width="1.5"/>
    <circle cx="280" cy="225" r="62" fill="none" stroke="#2b2519" stroke-width="1" stroke-dasharray="2 5"/>
    <text x="280" y="244" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="52" fill="#e0b04a" text-anchor="middle">&#955;</text>
    <!-- binding sub-labels -->
    <text x="280" y="292" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" fill="#8a8172" text-anchor="middle">(&#955;x.xx)</text>
  </g>

  <!-- corner registration marks -->
  <g stroke="#4a3f28" stroke-width="1">
    <line x1="24" y1="16" x2="24" y2="30"/>
    <line x1="24" y1="16" x2="38" y2="16"/>
    <line x1="536" y1="454" x2="536" y2="440"/>
    <line x1="536" y1="454" x2="522" y2="454"/>
  </g>
</svg>
