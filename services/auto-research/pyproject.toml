[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "starintel-auto-research"
version = "0.1.0"
description = "Authenticated StarIntel Auto Research HTTP service and Prolog-RLM direct harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
auto-research-api = "auto_research.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
